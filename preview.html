<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff5fb">
<title>Orihime MD · Web Response</title>
<style>
  :root{--bg:#fff7fc;--card:rgba(255,255,255,.88);--ink:#2c1b2a;--muted:#765f71;--pink:#ff72c8;--lav:#9b74ff;--line:rgba(108,54,97,.14)}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:
    radial-gradient(circle at 10% 10%,rgba(255,114,200,.22),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(155,116,255,.18),transparent 30%),var(--bg);padding:28px}
  .shell{width:min(760px,100%);margin:0 auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
  .brand{font-weight:900;letter-spacing:.04em}.chip{font-size:11px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.7)}
  .card{padding:22px;border-radius:28px;background:var(--card);border:1px solid var(--line);box-shadow:0 24px 70px rgba(86,42,76,.14);backdrop-filter:blur(18px)}
  .eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.title{font-size:25px;font-weight:900;margin:7px 0 16px}
  .response{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55;background:rgba(255,255,255,.78);padding:18px;border-radius:20px;border:1px solid var(--line);overflow:auto}
  .note{margin-top:14px;color:var(--muted);font-size:12px}.heart{color:var(--pink)}
</style>
</head>
<body>
<main class="shell">
  <div class="top"><div class="brand">🌸 ORIHIME · MD</div><div class="chip">WEB RESPONSE</div></div>
  <section class="card">
    <div class="eyebrow" id="command">response</div>
    <div class="title" id="title">Orihime MD</div>
    <div class="response" id="text">Open this page from the WhatsApp web preview to view the response.</div>
    <div class="note"><span class="heart">♥</span> This page is the web companion to an Orihime MD WhatsApp response.</div>
  </section>
</main>
<script>
  const p = new URLSearchParams(location.search);
  document.title = (p.get('title') || 'Orihime MD · Web Response') + ' · Orihime MD';
  document.getElementById('command').textContent = p.get('command') || 'response';
  document.getElementById('title').textContent = p.get('title') || 'Orihime MD';
  document.getElementById('text').textContent = p.get('text') || 'No response text was provided.';
</script>
</body>
</html>
